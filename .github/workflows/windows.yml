name: TruckTilt Windows Virtual Wheel

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - 'shared/**'
      - '.github/workflows/windows.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download pinned HIDMaestro SDK
        shell: pwsh
        run: |
          $url = 'https://github.com/hifihedgehog/HIDMaestro/releases/download/v1.11.0/HIDMaestro-v1.11.0.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'HIDMaestro-v1.11.0.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'HIDMaestro-v1.11.0'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll = Get-ChildItem -Path $extract -Recurse -Filter 'HIDMaestro.Core.dll' | Select-Object -First 1
          if (-not $dll) { throw 'HIDMaestro.Core.dll was not found in the pinned release.' }
          New-Item -ItemType Directory -Force -Path 'windows/TruckTilt.Host/third_party' | Out-Null
          Copy-Item $dll.FullName 'windows/TruckTilt.Host/third_party/HIDMaestro.Core.dll' -Force
          Write-Host "HIDMaestro SDK: $($dll.FullName)"

      - name: Restore
        run: dotnet restore windows/TruckTilt.Host/TruckTilt.Host.csproj

      - name: Build
        run: dotnet build windows/TruckTilt.Host/TruckTilt.Host.csproj --configuration Release --no-restore

      - name: Publish self-contained single EXE
        run: >
          dotnet publish windows/TruckTilt.Host/TruckTilt.Host.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Package Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/TruckTilt.Host.exe dist/TruckTilt.Host.exe
          @'
          TruckTilt Host v0.7 — Virtual Steering Wheel

          1. Extract this ZIP.
          2. Run TruckTilt.Host.exe as Administrator.
          3. Approve the first-run HIDMaestro driver installation.
          4. Start TruckTilt on Android.
          5. Open joy.cpl. You should see:
             TruckTilt Virtual Steering Wheel
          6. Bind Steering, Throttle, Brake, Clutch and buttons in ETS2/ATS.

          Device architecture:
          - DirectInput/HID wheel, not Xbox/XInput.
          - 5 dedicated simulation axes.
          - 32 independent buttons.
          - 8-way hat.
          - PID force-feedback interface exposed for future phone haptics.
          - UDP 45454, automatic LAN discovery.
          - Safety neutralization after 500 ms without valid input.
          '@ | Set-Content dist/README.txt
          Compress-Archive -Path dist/* -DestinationPath TruckTilt-Windows-v0.7-x64.zip -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TruckTilt-Windows-v0.7-x64
          path: publish/TruckTilt.Host.exe

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TruckTilt-Windows-v0.7-x64-ZIP
          path: TruckTilt-Windows-v0.7-x64.zip
