name: Windows Host

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/TruckTilt.Host/TruckTilt.Host.csproj

      - name: Publish self-contained single EXE
        run: >
          dotnet publish windows/TruckTilt.Host/TruckTilt.Host.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/TruckTilt.Host.exe dist/TruckTilt.Host.exe
          "Extract the ZIP and double-click TruckTilt.Host.exe.`nUDP port: 45454" | Set-Content dist/README.txt
          Compress-Archive -Path dist/* -DestinationPath TruckTilt-Windows-x64.zip -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TruckTilt-Windows-x64
          path: publish/TruckTilt.Host.exe

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TruckTilt-Windows-x64-ZIP
          path: TruckTilt-Windows-x64.zip
